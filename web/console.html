<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上品工序台</title>
<style>
  /* ---------------------------------------------------------------- tokens
     题材：中俄双语的 Ozon 上品工序台（一次采集 → 十六道工序 → 上架）。
     配色取冷石墨（工作台面）+ Ozon 自家蓝作唯一强调色；语义色只用于状态。
     刻意避开的通用套路：米色+陶土、近黑+荧光、等高圆角卡片墙、渐变装饰、
     全大写小标签、圆点分隔的元信息、按钮后加箭头。 */
  :root {
    --paper: #f1f4f8;
    --plate: #ffffff;
    --ink: #101720;
    --steel: #5b6876;
    --rule: #d8dfe7;
    --rule-strong: #b9c4d0;
    --ozon: #005bff;
    --pass: #0d7a4d;
    --stop: #b3261e;
    --hold: #8a5a00;
    --display: Georgia, "Songti SC", "Noto Serif SC", serif;
    --ui: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    --radius: 3px;            /* 统一小圆角：这是"台面"，不是卡片墙 */
    --rail-w: 300px;
    --index-w: 268px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1319; --plate: #151c25; --ink: #e7edf5; --steel: #97a4b3;
      --rule: #26313d; --rule-strong: #3a4856; --ozon: #6f9dff;
      --pass: #4cc38a; --stop: #ff8a80; --hold: #e0b34d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font: 14px/1.6 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ozon); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------------------------------------------------------------- shell */
  .shell { display: grid; grid-template-columns: var(--index-w) minmax(0, 1fr); min-height: 100vh; }
  .index { border-right: 1px solid var(--rule); background: var(--plate); padding: 22px 18px 40px; }
  .stage-area { padding: 22px 30px 60px; max-width: 1180px; }

  /* 台头：衬线显示体，字距收紧，不用全大写小标签 */
  .masthead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .masthead h1 { font: 600 26px/1.15 var(--display); letter-spacing: -0.01em; }
  .masthead p { margin: 0; color: var(--steel); }
  .vitals { margin: 16px 0 22px; display: flex; gap: 26px; flex-wrap: wrap; }
  .vital { min-width: 92px; }
  .vital b { display: block; font: 600 24px/1.1 var(--display); }
  .vital span { color: var(--steel); }

  .rule { height: 1px; background: var(--rule); margin: 18px 0; border: 0; }

  /* ---------------------------------------------------------------- 商品索引 */
  .index h2 { font: 600 15px/1.4 var(--ui); }
  .index .hint { color: var(--steel); margin: 4px 0 12px; }
  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
    padding: 10px 8px; border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; text-align: left; cursor: pointer; width: 100%;
  }
  .row:hover { background: color-mix(in srgb, var(--ozon) 6%, transparent); }
  .row[aria-current="true"] { background: color-mix(in srgb, var(--ozon) 10%, transparent); box-shadow: inset 2px 0 0 var(--ozon); }
  .row .pid { font: 600 14px/1.3 var(--ui); }
  .row .meta { grid-column: 1 / -1; color: var(--steel); font-size: 12.5px; }
  .chip { font-size: 12px; padding: 1px 7px; border: 1px solid var(--rule-strong); border-radius: 999px; white-space: nowrap; }
  .chip.pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 45%, var(--rule)); }
  .chip.stop { color: var(--stop); border-color: color-mix(in srgb, var(--stop) 45%, var(--rule)); }
  .chip.hold { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, var(--rule)); }

  /* ---------------------------------------------------------------- 工序导轨（记忆点） */
  .workbench { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: 34px; align-items: start; }
  .rail { position: relative; padding-left: 22px; }
  .rail::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--rule-strong); }
  .step { position: relative; padding: 5px 0 5px 2px; color: var(--steel); }
  .step::before {
    content: ""; position: absolute; left: -21px; top: 12px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--paper); border: 1px solid var(--rule-strong);
  }
  .step.done { color: var(--ink); }
  .step.done::before { background: var(--ink); border-color: var(--ink); }
  .step.current { color: var(--ozon); font-weight: 600; }
  .step.current::before { background: var(--ozon); border-color: var(--ozon); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ozon) 22%, transparent); }
  .step .n { font: 400 12px/1 var(--display); color: var(--steel); margin-right: 8px; }
  .step.current .n { color: var(--ozon); }
  /* 唯一的编排动效：选中商品时，标记滑到它当前所在工序 */
  .marker {
    position: absolute; left: 0; width: 13px; height: 13px; margin-top: -6px;
    border-left: 2px solid var(--ozon); border-top: 2px solid var(--ozon);
    transform: rotate(45deg); transition: top 320ms cubic-bezier(.22,.61,.36,1); opacity: 0;
  }

  /* ---------------------------------------------------------------- 校样区 */
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .sheet-head h2 { font: 600 19px/1.3 var(--display); }
  .sheet-head .sub { color: var(--steel); }
  .tabs { display: flex; gap: 2px; margin: 16px 0 0; border-bottom: 1px solid var(--rule); }
  .tab {
    border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--steel);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ozon); font-weight: 600; }
  .panel { padding: 18px 0 0; }
  .panel[hidden] { display: none; }

  .title-ru { font: 600 17px/1.45 var(--display); max-width: 70ch; }
  .body-ru { max-width: 74ch; white-space: pre-wrap; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .key { border: 1px solid var(--rule-strong); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; color: var(--steel); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--steel); font-weight: 600; }
  td.num, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }

  .plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
  .plate { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--plate); }
  .plate img { display: block; width: 100%; height: 168px; object-fit: cover; background: var(--paper); }
  .plate figcaption { padding: 6px 8px; color: var(--steel); font-size: 12.5px; border-top: 1px solid var(--rule); }

  .notes { margin: 0; padding-left: 18px; }
  .notes li { margin: 5px 0; }
  .notes li.stop { color: var(--stop); }
  .notes li.pass { color: var(--pass); }

  /* ---------------------------------------------------------------- 动作条 */
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 0; align-items: center; }
  .btn {
    border: 1px solid var(--rule-strong); background: var(--plate); border-radius: var(--radius);
    padding: 8px 14px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink); }
  .btn[disabled] { opacity: .55; cursor: progress; }
  .btn.primary { background: var(--ozon); border-color: var(--ozon); color: #fff; font-weight: 600; }
  .btn.danger { border-color: color-mix(in srgb, var(--stop) 55%, var(--rule)); color: var(--stop); font-weight: 600; }
  .btn.quiet { border-color: transparent; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; }
  .spin { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border: 2px solid currentColor;
          border-right-color: transparent; border-radius: 50%; animation: turn .7s linear infinite; vertical-align: -1px; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .out { margin-top: 14px; }
  details { border-top: 1px solid var(--rule); padding: 12px 0; }
  summary { cursor: pointer; color: var(--steel); }
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 420px; background: var(--plate);
    border: 1px solid var(--rule-strong); border-left: 3px solid var(--ozon); border-radius: var(--radius);
    padding: 10px 14px; box-shadow: 0 6px 20px rgb(16 23 32 / 12%);
  }
  .toast.stop { border-left-color: var(--stop); }
  .toast[hidden] { display: none; }

  @media (max-width: 1020px) {
    .shell { grid-template-columns: 1fr; }
    .index { border-right: 0; border-bottom: 1px solid var(--rule); }
    .workbench { grid-template-columns: 1fr; }
    .stage-area { padding: 18px 18px 48px; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- 左：商品索引 -->
  <aside class="index">
    <h2>商品索引</h2>
    <p class="hint" id="indexHint">正在读取…</p>
    <div class="rows" id="rows" role="listbox" aria-label="商品列表"></div>

    <details>
      <summary>关键词与选品</summary>
      <div class="actions">
        <button class="btn" onclick="keywords.load()">看关键词库</button>
        <button class="btn" onclick="keywords.sourcing()">生成选品清单</button>
        <button class="btn" onclick="keywords.collection()">生成采集清单</button>
      </div>
      <div class="out" id="keywordOut"></div>
    </details>

    <details>
      <summary>店铺</summary>
      <div class="out" id="stores">读取中…</div>
    </details>
  </aside>

  <!-- 右：工序台 -->
  <main class="stage-area">
    <header class="masthead">
      <h1>上品工序台</h1>
      <p id="health">检查服务状态…</p>
    </header>

    <div class="vitals">
      <div class="vital"><b id="vProducts">—</b><span>个商品</span></div>
      <div class="vital"><b id="vReady">—</b><span>个可提交</span></div>
      <div class="vital"><b id="vKeywords">—</b><span>个达标词</span></div>
      <div class="vital"><b id="vShops">—</b><span>家可用店铺</span></div>
    </div>

    <hr class="rule" />

    <div class="workbench">
      <!-- 工序导轨：这是本页唯一"用力"的地方（工序是真序列，编号才有意义） -->
      <nav class="rail" id="rail" aria-label="上品工序">
        <div class="marker" id="marker" aria-hidden="true"></div>
      </nav>

      <section>
        <div class="sheet-head">
          <div>
            <h2 id="sheetTitle">选一个商品</h2>
            <div class="sub" id="sheetSub">左边点一个商品，这里显示它的校样与工序进度。</div>
          </div>
          <button class="btn quiet" onclick="products.refresh()">刷新</button>
        </div>

        <div class="tabs" role="tablist" aria-label="校样">
          <button class="tab" role="tab" aria-selected="true"  onclick="sheet.tab('copy')">文案</button>
          <button class="tab" role="tab" aria-selected="false" onclick="sheet.tab('attrs')">属性</button>
          <button class="tab" role="tab" aria-selected="false" onclick="sheet.tab('images')">图片</button>
          <button class="tab" role="tab" aria-selected="false" onclick="sheet.tab('gates')">载荷与阻断</button>
        </div>

        <div class="panel" id="panel-copy">（还没有文案）</div>
        <div class="panel" id="panel-attrs" hidden></div>
        <div class="panel" id="panel-images" hidden></div>
        <div class="panel" id="panel-gates" hidden></div>

        <div class="actions">
          <button class="btn primary" id="btn-run"     onclick="actions.run()">跑流程（干跑）</button>
          <button class="btn"         id="btn-publish" onclick="actions.publish()">发布图片</button>
          <button class="btn"         id="btn-pre"     onclick="actions.preflight()">提交前预检</button>
          <button class="btn"         id="btn-verify"  onclick="actions.verify()">提交后核对</button>
          <button class="btn danger"  id="btn-submit"  onclick="actions.submit()">真实提交</button>
        </div>

        <div class="out" id="out">操作结果会显示在这里。</div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { products: [], current: null, store: null, steps: [], summary: null };

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!response.ok) throw Object.assign(new Error(`${response.status}`), { data });
  return data;
}

function toast(message, kind) {
  const box = $('toast');
  box.textContent = message;
  box.className = 'toast' + (kind === 'stop' ? ' stop' : '');
  box.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { box.hidden = true; }, kind === 'stop' ? 9000 : 5000);
}

function busy(button, on) {
  if (!button) return;
  button.disabled = on;
  if (on) { button.dataset.label = button.textContent; button.innerHTML = '<span class="spin"></span>' + button.dataset.label; }
  else if (button.dataset.label) { button.textContent = button.dataset.label; }
}

/* ------------------------------------------------------------------ 引导：服务状态 / 工序 / 店铺 */
async function boot() {
  try { await api('GET', '/health'); $('health').textContent = '服务正常'; }
  catch { $('health').textContent = '服务不可用'; }
  try {
    const data = await api('GET', '/api/workbench/steps');
    state.steps = data.steps || [];
  } catch { state.steps = []; }
  try {
    const data = await api('GET', '/api/workbench/stores');
    const shops = data.shops || [];
    const usable = shops.filter((shop) => shop.enabled && shop.credentials_ready);
    state.store = usable.length ? usable[0].id : (shops[0] || {}).id || null;
    $('vShops').textContent = usable.length;
    $('stores').innerHTML = shops.map((shop) => {
      const state_ = !shop.enabled ? '未启用'
        : shop.credentials_ready ? '可用' : '缺凭据 ' + (shop.missing_env || []).join('、');
      return `<div>${shop.id}｜${state_}｜${shop.default_currency_code || ''}</div>`;
    }).join('') || '还没有店铺';
  } catch { $('stores').textContent = '读取店铺失败'; }
  await products.refresh();
}

/* ------------------------------------------------------------------ 商品索引 */
const products = {
  async refresh() {
    $('indexHint').textContent = '正在读取…';
    try {
      const data = await api('GET', '/api/workbench/doctor');
      state.products = data.products || [];
      const ready = state.products.filter((item) => item.ready_to_submit).length;
      $('vProducts').textContent = state.products.length;
      $('vReady').textContent = ready;
      $('indexHint').textContent = state.products.length
        ? `${state.products.length} 个商品，${ready} 个可直接提交`
        : '还没有商品：先在“关键词与选品”里生成采集清单';
      $('rows').innerHTML = state.products.map((item) => {
        const chip = item.ready_to_submit ? 'pass' : 'hold';
        const text = item.ready_to_submit ? '可提交' : (item.status || '进行中');
        const blockers = (item.blockers || [])[0] || (item.warnings || [])[0] || '无阻断项';
        return `<button class="row" role="option" aria-current="${state.current === item.product_id}"
                  onclick="select('${item.product_id}')">
            <span class="pid">${item.product_id}</span>
            <span class="chip ${chip}">${text}</span>
            <span class="meta">${String(blockers).slice(0, 60)}</span>
          </button>`;
      }).join('');
      try { const keywords = await api('GET', '/api/keywords?limit=1'); $('vKeywords').textContent = keywords.count ?? '—'; }
      catch { $('vKeywords').textContent = '—'; }
    } catch (error) {
      $('indexHint').textContent = '读取商品失败：' + error.message;
    }
  },
};

/* ------------------------------------------------------------------ 工序导轨 */
function rails() {
  const product = state.products.find((item) => item.product_id === state.current);
  const completed = new Set(product?.completed_steps || []);
  const current = product?.current_step || state.summary?.status?.current_step || null;
  const steps = state.steps.length ? state.steps : [...completed].map((step) => ({ step, label: step }));
  $('rail').innerHTML = `<div class="marker" id="marker" aria-hidden="true"></div>` + steps.map((item, index) => {
    const cls = completed.has(item.step) ? 'done' : (item.step === current ? 'current' : '');
    return `<div class="step ${cls}" data-step="${item.step}">
        <span class="n">${String(index + 1).padStart(2, '0')}</span>${item.label}
      </div>`;
  }).join('');
  moveMarker();
}

function moveMarker() {
  const product = state.products.find((item) => item.product_id === state.current);
  const marker = $('marker');
  if (!marker || !product) { if (marker) marker.style.opacity = 0; return; }
  const done = product.completed_steps || [];
  const target = done.length ? done[done.length - 1] : null;
  const node = target ? $('rail').querySelector(`[data-step="${target}"]`) : null;
  if (!node) { marker.style.opacity = 0; return; }
  marker.style.opacity = 1;
  marker.style.top = (node.offsetTop + 12) + 'px';
}

/* ------------------------------------------------------------------ 校样 */
const sheet = {
  tab(which) {
    for (const name of ['copy', 'attrs', 'images', 'gates']) {
      $('panel-' + name).hidden = name !== which;
    }
    document.querySelectorAll('.tab').forEach((button) => {
      const order = ['文案', '属性', '图片', '载荷与阻断'];
      const index = ['copy', 'attrs', 'images', 'gates'].indexOf(which);
      button.setAttribute('aria-selected', String(button.textContent.trim() === order[index]));
    });
  },
  render() {
    const data = state.summary || {};
    const empty = !state.current;
    $('sheetTitle').textContent = empty ? '选一个商品' : state.current;
    $('sheetSub').textContent = empty ? '左边点一个商品，这里显示它的校样与工序进度。'
      : `${data.category?.category_name || ''} ${data.category?.category_id || ''}/${data.category?.type_id || ''}`.trim();

    $('panel-copy').innerHTML = data.title_ru
      ? `<div class="title-ru">${data.title_ru}</div>
         <div class="keys">${(data.hashtags || []).map((tag) => `<span class="key">${tag}</span>`).join('')}
           ${(data.primary_keywords || []).map((word) => `<span class="key">${word}</span>`).join('')}</div>
         <hr class="rule" />
         <div class="body-ru">${(data.description_ru || '').slice(0, 2200)}</div>`
      : '（还没有俄文文案：先点“跑流程（干跑）”）';

    const attributes = data.attributes || [];
    $('panel-attrs').innerHTML = attributes.length
      ? `<table><thead><tr><th>属性</th><th>名称</th><th>值</th><th>来源</th></tr></thead><tbody>
          ${attributes.map((item) => `<tr>
            <td class="num">${item.attribute_id}</td><td>${item.attribute_name || ''}</td>
            <td><b>${item.value ?? ''}</b></td><td class="mono">${item.mapping_method || item.source || ''}</td>
          </tr>`).join('')}
         </tbody></table>
         <p class="sub">必填 ${data.required_summary?.filled ?? 0}/${data.required_summary?.total ?? 0}${
           (data.required_summary?.missing_attribute_ids || []).length
             ? `，仍缺 ${data.required_summary.missing_attribute_ids.join('、')}` : ''}</p>
         ${(data.variants || []).length ? `<table><thead><tr><th>SKU</th><th>颜色</th><th>人民币</th><th>卢布</th></tr></thead><tbody>
           ${data.variants.map((item) => `<tr><td>${item.sku_id}</td><td>${item.color ?? ''}</td>
             <td class="num">${item.price_cny ?? ''}</td><td class="num">${item.price_rub ?? ''}</td></tr>`).join('')}
         </tbody></table>` : ''}`
      : '（还没有属性：属性在“跑流程”里生成）';

    const images = data.images || {};
    const slots = Object.keys(images);
    $('panel-images').innerHTML = slots.length
      ? `<div class="plates">${slots.map((slot) => `<figure class="plate">
           <img src="${images[slot]}" alt="${slot}" loading="lazy" /><figcaption>${slot}</figcaption></figure>`).join('')}</div>
         <p class="sub">已发布 ${slots.length} 张，计划 ${(data.planned_slots || []).length} 个槽位。图片质检：${
           data.image_qc?.decision || '?'}（${data.image_qc?.score ?? '?'} 分）</p>`
      : '（还没有公网图片地址：点“发布图片”）';

    const blockers = data.blockers || [];
    $('panel-gates').innerHTML = `<ul class="notes">
        ${blockers.length ? blockers.map((item) => `<li class="stop">${item}</li>`).join('')
                          : '<li class="pass">没有阻断项</li>'}
      </ul>`;
  },
};

async function select(productId) {
  state.current = productId;
  document.querySelectorAll('.row').forEach((row) => row.setAttribute('aria-current', 'false'));
  await products.refresh();          // 先刷新索引（导轨要读 completed_steps）
  try {
    const data = await api('GET', `/api/workbench/products/${productId}/summary`);
    state.summary = { ...data, status: state.products.find((item) => item.product_id === productId) };
  } catch (error) {
    state.summary = {};
    toast('读要点失败：' + (error.data?.detail || error.message), 'stop');
  }
  rails();
  sheet.render();
  $('out').textContent = '操作结果会显示在这里。';
}

/* ------------------------------------------------------------------ 动作 */
async function run(button, label, path, body, done) {
  busy(button, true);
  $('out').textContent = label + '进行中…（真提交或出图可能要几十秒）';
  try {
    const data = await api('POST', path, body);
    $('out').textContent = JSON.stringify(data, null, 2).slice(0, 6000);
    toast(done(data));
    await products.refresh();
    if (state.current) await select(state.current);
  } catch (error) {
    const detail = error.data?.detail || error.data || error.message;
    $('out').textContent = JSON.stringify(detail, null, 2);
    toast(typeof detail === 'string' ? detail.slice(0, 160) : '操作失败', 'stop');
  } finally {
    busy(button, false);
  }
}

const actions = {
  run: () => run($('btn-run'), '跑流程', `/api/workbench/products/${state.current}/run`, { provider: 'ark' },
    () => '流水线已跑完（干跑，未写 Ozon）'),
  publish: () => run($('btn-publish'), '发布图片', `/api/workbench/products/${state.current}/publish-images`,
    undefined, (data) => `已发布 ${data.summary?.uploaded ?? 0} 张图`),
  preflight: () => run($('btn-pre'), '提交前预检', `/api/workbench/products/${state.current}/preflight`,
    { store: state.store }, (data) => data.report?.ok ? '预检通过，可以提交' : '预检未通过，看阻断项'),
  verify: () => run($('btn-verify'), '提交后核对', `/api/workbench/products/${state.current}/verify`,
    { store: state.store }, (data) => data.report?.ok ? 'Ozon 上的数据核对通过' : '核对有未通过项'),
  async submit() {
    const typed = prompt(`真实提交会把 ${state.current} 写到店铺「${state.store}」，并真的在 Ozon 建商品。\n输入 SUBMIT 继续：`);
    if (typed !== 'SUBMIT') { $('out').textContent = '已取消（没有输入 SUBMIT）。'; return; }
    await run($('btn-submit'), '真实提交', `/api/workbench/products/${state.current}/submit`,
      { store: state.store, confirm: 'SUBMIT' }, () => '已提交到 Ozon，接着点“提交后核对”看结果');
  },
};

/* ------------------------------------------------------------------ 关键词与选品 */
function table(rows) {
  if (!Array.isArray(rows) || !rows.length) return '<p class="sub">没有数据</p>';
  const keys = Array.from(new Set(rows.flatMap((row) => Object.keys(row || {})))).slice(0, 6);
  return `<table><thead><tr>${keys.map((key) => `<th>${key}</th>`).join('')}</tr></thead><tbody>
    ${rows.slice(0, 20).map((row) => `<tr>${keys.map((key) => {
      const value = row[key];
      const text = value && typeof value === 'object' ? JSON.stringify(value) : (value ?? '');
      return `<td>${String(text).slice(0, 90)}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
}

const keywords = {
  async load() {
    try {
      const data = await api('GET', '/api/keywords?limit=15');
      $('keywordOut').innerHTML = `<p class="sub">共 ${data.count ?? 0} 条</p>` + table(data.items || []);
    } catch (error) { $('keywordOut').textContent = '读取失败：' + error.message; }
  },
  async sourcing() {
    $('keywordOut').textContent = '生成中…';
    try { const data = await api('POST', '/api/workbench/sourcing-plan', { top: 10 });
      $('keywordOut').innerHTML = table((data.plan || {}).rows || []); toast('选品清单已生成'); }
    catch (error) { $('keywordOut').textContent = '生成失败：' + (error.data?.detail || error.message); }
  },
  async collection() {
    $('keywordOut').textContent = '生成中…';
    try { const data = await api('POST', '/api/workbench/collection-plan', { top: 10, from_library: true });
      $('keywordOut').innerHTML = table((data.plan || {}).tasks || []); toast('采集清单已生成'); }
    catch (error) { $('keywordOut').textContent = '生成失败：' + (error.data?.detail || error.message); }
  },
};

boot();
window.addEventListener('resize', moveMarker);
</script>
