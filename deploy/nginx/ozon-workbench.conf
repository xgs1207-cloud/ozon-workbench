# Ozon 工作台公网入口（nginx 反向代理 + Basic Auth）
#
# 部署位置：/etc/nginx/sites-available/ozon-workbench（软链到 sites-enabled）
# 配套文件：/etc/nginx/ozon-workbench.htpasswd（htpasswd -c 或 openssl passwd -apr1 生成，不进仓库）
#
# 为什么需要它：uvicorn 只绑 127.0.0.1:8766（服务本身无鉴权，不能直接暴露公网）。
# 本配置在公网 8088 端口加 Basic Auth，代理到本地 uvicorn。
# 腾讯云安全组需放行入站 TCP:8088（来源 0.0.0.0/0）。
#
# 生成密码：
#   PASS=你的密码
#   echo "ozon:$(openssl passwd -apr1 $PASS)" | sudo tee /etc/nginx/ozon-workbench.htpasswd
#   sudo chmod 644 /etc/nginx/ozon-workbench.htpasswd
#
# 启用：
#   sudo cp deploy/nginx/ozon-workbench.conf /etc/nginx/sites-available/ozon-workbench
#   sudo ln -sf /etc/nginx/sites-available/ozon-workbench /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    # 采集入库载荷可能较大（SKU/图片URL较多）
    client_max_body_size 25m;

    # Basic Auth：唯一的门禁（服务本身无鉴权，靠这里挡住陌生人）
    auth_basic "Ozon Workbench";
    auth_basic_user_file /etc/nginx/ozon-workbench.htpasswd;

    # 插件从 background service worker 发请求（manifest 有 http://*/* host 权限，无 CORS 限制）
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
