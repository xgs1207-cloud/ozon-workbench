<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Ozon 工作台采集</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <details class="connection-settings" open>
        <summary>工作台连接</summary>
        <label for="factory-url">工作台地址（可带登录账号：http://账号:密码@地址:端口）</label>
        <input id="factory-url" type="url" placeholder="http://43.132.190.110:8088" spellcheck="false">
        <div class="connection-actions">
          <button id="save-connection" type="button">保存并连接</button>
          <button id="test-connection" type="button" class="secondary">测试连接</button>
        </div>
        <small id="connection-result">地址保存在本浏览器，无需访问码；商品与任务在工作台共享</small>
      </details>
      <div id="page-status" class="status">检查当前页面...</div>
      <section id="market-capture" class="task-runner" hidden>
        <label for="market-period">Seerfar 报表所属月份（必填）</label>
        <input id="market-period" type="month">
        <label for="market-token">市场数据写入令牌（与服务器环境变量一致）</label>
        <input id="market-token" type="password" autocomplete="off" spellcheck="false">
        <button id="capture-market" type="button">将当前可见报表页入库</button>
        <small>工作台地址须为 HTTPS，或已开 SSH 隧道的 http://127.0.0.1:8766。只读取当前可见页，不自动翻页或调用付费接口。</small>
      </section>
      <div id="product-capture-ui" hidden>
      <section class="summary">
        <div class="label">标题</div>
        <div id="title" class="value">unknown</div>
        <div class="grid">
          <div>
            <span id="main-count">0</span>
            <small>主图候选</small>
          </div>
          <div>
            <span id="sku-count">0</span>
            <small>SKU</small>
          </div>
          <div>
            <span id="detail-count">0</span>
            <small>详情图</small>
          </div>
        </div>
      </section>
      <button id="capture" disabled>采集当前商品</button>
      <button id="preview-toggle" class="secondary" disabled>查看采集预览</button>
      <button id="debug-export" class="secondary" disabled>导出当前页面SKU诊断</button>
      </div>
      <section class="task-runner">
        <button id="open-inbox" class="secondary">打开共享工作台</button>
        <small>采集完成后，请在共享工作台运行单个商品或批次</small>
      </section>
      <div id="progress" class="progress">等待操作</div>
      <section id="preview" class="preview" hidden>
        <h2>采集预览</h2>
        <div class="label">SKU列表</div>
        <ul id="sku-list"></ul>
        <div class="label">主图缩略图</div>
        <div id="main-thumbs" class="thumbs"></div>
        <div class="label">详情图缩略图</div>
        <div id="detail-thumbs" class="thumbs"></div>
      </section>
      <section id="duplicate" class="duplicate" hidden>
        <div id="duplicate-message"></div>
        <button id="open-existing" class="secondary">打开已有商品</button>
        <button id="create-version">重新采集并创建新版本</button>
      </section>
      <pre id="result"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
