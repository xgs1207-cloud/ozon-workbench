<body>
<header class="top"><div class="brand"><i></i>Ozon 上品工作台</div><div class="row"><span class="muted" id="health">读取中</span></div></header>
<div class="shell"><nav class="rail" aria-label="工作流程"><p>工作流程</p><button data-view="categories" class="on"><span class="num">1</span> 类目机会</button><button data-view="source"><span class="num">源</span> Seerfar 原始报表</button><button data-view="opportunities"><span class="num">商</span> 商品机会库</button><button data-view="keywords"><span class="num">2</span> 关键词决策</button><button data-view="sessions"><span class="num">3</span> 1688 商品批次</button><button data-view="product"><span class="num">4</span> 上架审核</button><hr class="sectionline"><button data-view="stores"><span class="num">店</span> 店铺授权</button></nav><main id="main" class="main" aria-live="polite"></main><aside class="aside"><h3>当前决策依据</h3><div id="evidence">先选择一个类目，查看各项评分和源数据。</div><hr class="sectionline"><h3>工作台边界</h3><ul><li>Seerfar 类目仅用于选品，不是 Ozon 上架类目。</li><li>Ozon API 只读取真实类目与属性；商品卡写入需逐项确认及批次开关。</li><li>豆包用于文本分析与图片规划；生图使用当前配置的服务，按图位逐张确认费用。</li><li>“提交成功”不等于“已开售”；需以 Ozon 审核及库存状态为准。</li></ul></aside></div><div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'categories',category:null,primary:null,secondary:new Set(),session:null,product:null,stores:[],authorizationContext:{can_submit_credentials:false,reason:'正在读取安全连接状态'},selectedOzonStore:null,categories:[],keywords:[],sessions:[],products:[],guided:null,skus:null,ozonResults:[],attempts:[],sourceRecords:[],sourceColumns:[],sourceTotal:0,sourceDataset:'categories',sourceOffset:0,sourceLimit:50,sourceQuery:'',sourcePeriod:'',sourceCategory:'',sourceLoading:false,sourceError:'',sourceOpenId:null};
const listingState={key:null,drafts:new Map(),loading:false,error:'',seq:0};
// Drafts stay in memory, never in browser storage. A touched blank is intentional.
const productEditor={drafts:new Map(),step:'form',autofillSeq:0};
const listingDetailKeys=['material','package_quantity','product_length_mm','product_width_mm','product_height_mm','product_weight_g','package_length_mm','package_width_mm','package_height_mm','package_weight_g'];
function productDraft(){if(!state.product)return null;let d=productEditor.drafts.get(state.product);if(!d){const g=state.guided||{},human=g.human_confirmations||{},measured=g.measurements?.product||{};d={details:Object.fromEntries(listingDetailKeys.map(k=>[k,k==='material'?human.material??'':k==='package_quantity'?human.package_quantity??'':measured[k]??''])),touched:new Set(),provenance:{},edits:{},prices:{},loaded:false,dirty:false,saving:false,error:'',autofillLoading:false,autofillError:'',unresolved:[],autofillCount:0,sourceOfferIds:{}};productEditor.drafts.set(state.product,d)}return d}
function sourceCaption(meta){if(!meta)return '';const source=String(meta.source||''),manual=source==='manual'||source==='human'||source==='manual_confirmation',preset=/default|preference|preset/.test(source);const label=['generated_copy','ai_generated_copy'].includes(source)?'AI 文案':preset?'工作台默认':source==='system_generated'?'系统生成':manual?'人工填写':/ozon|category/i.test(source)?'Ozon 官方':/sku|spec/i.test(source)?'1688 规格':'1688 采集';return `<span class="source-label ${manual||preset?'manual':''}" title="${esc(typeof meta.evidence==='string'?meta.evidence:JSON.stringify(meta.evidence||''))}">${label}</span>`}
function detailSource(key){const d=productDraft(),empty=!String(d?.details[key]??'').trim(),origin=d?.provenance[key];if(d?.touched.has(key))return `<span class="source-label manual">${empty?'人工留空':'人工修改'}</span>`;if(empty&&origin)return `<span class="source-label ${origin.source==='manual'?'manual':'pending'}">${origin.source==='manual'?'人工留空':'待补充'}</span>`;return sourceCaption(origin)}
async function loadListingDetails(){const id=state.product,d=productDraft();if(!d)return;try{const r=await api(`/api/workbench/products/${id}/listing-details`);if(id!==state.product)return;for(const key of listingDetailKeys){if(!d.touched.has(key)&&Object.hasOwn(r.details||{},key)){d.details[key]=r.details[key]??'';if(r.provenance?.[key])d.provenance[key]=r.provenance[key]}}d.loaded=true}catch(e){if(id===state.product)d.error=e.message}if(state.view==='product'&&id===state.product)hydrateProductFields()}
function applyListingAutofill(result){const basic=productDraft(),d=listingDraft();if(!basic)return;let count=0;for(const [key,item] of Object.entries(result.basic_fields||{})){if(!listingDetailKeys.includes(key)||basic.touched.has(key)||String(basic.details[key]??'').trim()||item?.value==null)continue;basic.details[key]=item.value;basic.provenance[key]=result.provenance?.basics?.[key]||item;basic.dirty=true;count++}if(d&&result.scope===d.form.scope){d.fieldDisplay={...(d.fieldDisplay||{}),...(result.field_display||{})};d.provenance=d.provenance||{attributes:{},per_sku_attributes:{}};d.touched=d.touched||new Set();for(const [id,values] of Object.entries(result.attributes||{})){if(d.touched.has(`common:${id}`)||Object.hasOwn(d.attributes,id)||!values.length)continue;d.attributes[id]=values;d.provenance.attributes[id]=result.provenance?.attributes?.[id]||{};d.dirty=true;count++}for(const [sku,attrs] of Object.entries(result.per_sku_attributes||{})){if(!d.selectedSkus.some(s=>(s.sku_id||s.id)===sku))continue;const target=d.perSku[sku]||(d.perSku[sku]={}),origin=d.provenance.per_sku_attributes[sku]||(d.provenance.per_sku_attributes[sku]={});for(const [id,values] of Object.entries(attrs)){if(d.touched.has(`common:${id}`)||d.touched.has(`${sku}:${id}`)||Object.hasOwn(target,id)||!values.length)continue;target[id]=values;origin[id]=result.provenance?.per_sku_attributes?.[sku]?.[id]||{};d.dirty=true;count++}}}basic.unresolved=result.unresolved||[];basic.sourceOfferIds=result.seller_offer_ids||{};basic.autofillCount=count;return count}
async function loadListingAutofill({resolve=false}={}){const id=state.product,basic=productDraft(),d=listingDraft();if(!id||!basic||basic.autofillLoading)return;const seq=++productEditor.autofillSeq;basic.autofillLoading=true;basic.autofillError='';renderProductSupport();try{const shop=d?.form.shop_id||selectedReadStore()?.id,query=new URLSearchParams(shop?{shop}:{});const r=await api(`/api/workbench/products/${id}/listing-autofill?${query}`,resolve?json('POST',{shop}):{});if(id!==state.product||seq!==productEditor.autofillSeq)return;const count=applyListingAutofill(r);if(resolve)notice(count?`已补入 ${count} 项有依据的信息；请检查后保存`:'没有可安全补入的新字段，未覆盖任何现有值')}catch(e){if(id===state.product)basic.autofillError=e.message}finally{basic.autofillLoading=false;if(state.view==='product'&&id===state.product){redrawListingForm();hydrateProductFields();renderProductSupport()}}}
const n=v=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
function notice(msg,bad=false){const el=$('#toast');el.textContent=msg;el.style.background=bad?'#9b2331':'#1c2b45';el.hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.hidden=true,5500)}
async function api(path,opts={}){const response=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});let body;try{body=await response.json()}catch{body={detail:'服务器返回了非 JSON 响应'}}if(!response.ok)throw Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail||body));return body}
const json=(method,body)=>({method,body:JSON.stringify(body)});
function title(label,sub){return `<div class="head"><div><div class="eyebrow">RESEARCH → LISTING</div><h1>${label}</h1><p>${sub}</p></div></div>`}
function activate(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));renderEvidence()}
function acceptStores(result){state.stores=result.shops||[];state.authorizationContext=result.authorization_context||{can_submit_credentials:false,reason:'服务器尚未启用安全授权入口'};const ready=state.stores.filter(x=>x.enabled&&x.credentials_ready);if(!ready.some(x=>x.id===state.selectedOzonStore))state.selectedOzonStore=(ready.find(x=>x.is_default)||ready[0])?.id||null}
async function refreshStores(){acceptStores(await api('/api/workbench/stores'))}
async function load(){try{const [cats,sessions,products,stores]=await Promise.all([api('/api/research/categories'),api('/api/research/sessions'),api('/api/collector/products'),api('/api/workbench/stores')]);state.categories=cats.items;state.sessions=sessions.items;state.products=products.items;acceptStores(stores);$('#health').textContent='已连接 · '+cats.recommended_count+' 个推荐类目';render()}catch(e){$('#health').textContent='连接异常';$('#main').innerHTML=title('暂时无法加载',esc(e.message))+'<div class="panel">请检查服务、数据库及登录状态。</div>'}}
function renderEvidence(){if(state.view==='source'){$('#evidence').innerHTML='<p>这里显示已入库的 Seerfar 可见报表原值。它们是采集证据，不是 Ozon 官方类目，也不等于推荐结论。</p><p>点击“查看整行”可核对原始字段、采集时间与来源页。</p>';return}const row=state.view==='keywords'?state.keywords.find(x=>x.key===state.primary):state.categories.find(x=>x.key===state.category);$('#evidence').innerHTML=row?`<div class="score" style="font-size:26px">${n(row.score)} <small style="font-size:12px;color:var(--muted)">/ 100</small></div><p>${esc(row.label)} · ${esc(row.confidence==='high'?'高可信':'有限可信')}</p><ul>${row.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>同源月度观察：${n(row.metrics.history_months)} 期<br>最新：${esc(row.metrics.latest_period)}<br>证据行 ID：${esc(row.metrics.evidence_ids.join(', '))}</p>`:'<p>先选择类目或主词，查看评分解释与数据来源。</p>'}
function render(){document.body.classList.toggle('product-mode',state.view==='product');$('#main').classList.toggle('source-page',['source','opportunities'].includes(state.view));$('#main').classList.toggle('product-page',state.view==='product');activate();({categories:renderCategories,source:renderSource,opportunities:renderOpportunities,keywords:renderKeywords,sessions:()=>{renderSessions();$('#main').insertAdjacentHTML('beforeend',renderCollectedProducts())},product:renderProduct,stores:renderStores})[state.view]();if(state.view==='opportunities')$('#evidence').innerHTML='<p>商品必须上架不足 90 天且销量大于 0。竞争密度来自已采集类目报表；评论数只衡量评价壁垒。</p><p>同口径类目和同类目商品分别至少 5 个；缺字段或过期快照列入“待核验”。只比较采集样本，不代表全市场。</p><p>退货取消率仅扣分。机会分不是利润承诺；商品卡可跳转 Ozon 查看。</p>';if(state.view==='stores')$('#evidence').innerHTML='<p>授权只验证连接并读取类目、属性和字典，不会创建商品卡，也不会开启任何批次的自动发布。</p><p>Client-ID 和 API Key 请从 Ozon Seller 的 API 密钥页面获取。Pro 会员不能代替 API 凭据及接口权限。</p><p>API Key 仅发送给本工作台服务器；不写入浏览器存储，不在列表中回显。</p>';if(state.view==='sessions'&&state.session)refreshAttempts();if(state.view==='product'&&state.guided)hydrateProductFields()}
function renderCollectedProducts(){return `<div class="panel"><h2>已采集的 1688 商品</h2><p class="muted">尚未关联研究批次也可以先选择规格；开始上架前再关联关键词批次。</p>${state.products.length?`<div class="tablewrap"><table><thead><tr><th>商品</th><th>采集名称</th><th>规格数</th><th></th></tr></thead><tbody>${state.products.map(x=>`<tr><td>${esc(x.product_id)}</td><td>${esc(x.title_zh||'未提供名称')}</td><td>${n(x.sku_count)}</td><td><button class="btn small" data-action="product" data-id="${esc(x.product_id)}">选择规格 / 审核</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">请先用插件采集 1688 商品，全部规格和图片会保存在这里。</div>'}</div>`}
function hydrateProductFields(){const d=productDraft();if(!d)return;if($('#factMaterial'))$('#factMaterial').value=d.details.material??'';if($('#factQuantity'))$('#factQuantity').value=d.details.package_quantity??'';document.querySelectorAll('.dim').forEach(x=>x.value=d.details[`${x.dataset.kind}_${x.dataset.key}`]??'');document.querySelectorAll('[data-detail-source]').forEach(x=>x.innerHTML=detailSource(x.dataset.detailSource));for(const [id,value] of Object.entries(d.edits)){const input=document.getElementById(id);if(input)input.value=value}document.querySelectorAll('.skuPrice').forEach(x=>{if(d.prices[x.dataset.sku]){x.value=d.prices[x.dataset.sku].price;x.parentElement.querySelector('select').value=d.prices[x.dataset.sku].currency}});document.querySelectorAll('.slotPrompt,.slotRefs').forEach(x=>{const key=`${x.classList.contains('slotPrompt')?'prompt':'refs'}:${x.dataset.slot}`;if(Object.hasOwn(d.edits,key))x.value=d.edits[key]});const note=$('#listingDetailsStatus');if(note)note.textContent=d.dirty?'有未保存的商品资料':d.loaded?'商品资料草稿已读取':'正在读取商品资料';const error=$('#listingDetailsError');if(error){error.textContent=d.error;error.hidden=!d.error}renderProductSupport()}
async function refreshAttempts(){try{const r=await api(`/api/research/sessions/${state.session}/publish-attempts`),el=$('#attempts');if(el)el.innerHTML=`<h3>自动提交记录</h3>${r.items.length?`<div class="tablewrap"><table><thead><tr><th>商品</th><th>店铺</th><th>结果</th><th>时间</th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${esc(x.product_id)}</td><td>${esc(x.store_id)}</td><td>${esc(x.state)}</td><td>${esc(x.attempted_at)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">暂无真实写入记录。</p>'}`}catch(e){const el=$('#attempts');if(el)el.textContent='读取提交记录失败：'+e.message}}
function renderCategories(){const rows=state.categories;$('#main').innerHTML=title('类目机会','只呈现数据库中已有的 Seerfar 观察；需求稳定、竞争较低优先，退货/取消率仅扣分。')+`<div class="panel"><div class="row between"><h2>候选类目 <span class="tag">${rows.filter(x=>x.recommended).length} 个推荐</span></h2><button class="btn ghost small" data-action="config">调整筛选规则</button></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>类目</th><th>机会分</th><th>需求均值</th><th>稳定度</th><th>竞争密度</th><th>历史</th><th>决策</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.label)}</b><br><span class="muted">${esc(x.key)}</span></td><td class="score">${n(x.score)}</td><td>${n(x.metrics.demand)}</td><td>${n(x.metrics.stability)}</td><td>${n(x.metrics.competition_density)}</td><td>${x.metrics.history_months} 月</td><td>${x.recommended?`<button class="btn small" data-action="category" data-key="${esc(x.key)}">查看关键词</button>`:`<span class="tag warn" title="${esc(x.warnings.join('；'))}">证据不足</span>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有可分析的类目数据。先通过插件或文件导入 Seerfar 月度快照；系统不会编造推荐。</div>'}</div><div id="settings"></div>`}
function sourceSafeUrl(value){try{const url=new URL(String(value));return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function imageBackendInfo(g=state.guided){const backend=g?.image_backend||{};return {name:backend.name||null,label:backend.label||'未配置生图模型',model:backend.model||'',configured:backend.configured===true,produces_final_images:backend.produces_final_images===true,aspect_ratio:backend.aspect_ratio||'3:4',image_size:backend.image_size||'',normalized_size:backend.normalized_size||'900×1200'}}
function imageBackendReady(g=state.guided){const backend=imageBackendInfo(g);return backend.configured&&backend.produces_final_images}
function imageBackendDisplay(g=state.guided){const backend=imageBackendInfo(g);return [backend.label,backend.model].filter(Boolean).join(' · ')}
function imageBackendSummaryHtml(g=state.guided){const backend=imageBackendInfo(g),ready=imageBackendReady(g);return `<div class="hint ${ready?'':'warn'}" data-image-backend="${esc(backend.name||'none')}"><strong>当前生图：${esc(imageBackendDisplay(g))}</strong><br>请求比例 ${esc(backend.aspect_ratio)}${backend.image_size?` · 请求规格 ${esc(backend.image_size.toUpperCase())}`:''} · 上架文件保存为 ${esc(backend.normalized_size)}${!ready?`<br>${backend.name==='placeholder'?'当前仅为占位图后端，不能生成正式上架图片。':'生图尚未配置完成。'}请在服务器配置 IMAGE_GENERATOR 和所选服务的密钥，然后重启工作台；不要在此页面填写密钥。`:''}</div>${backend.name==='rightapi'?'<p class="field-help">RightAPI 参考图必须有可公开读取的 HTTPS 原图地址；仅有本地文件、且无法准确关联原图地址时，会先阻止请求，需要重新采集。不自动公开上传参考图。2K 是服务请求规格，保存时统一为 900×1200。文案和图片规划仍使用豆包。</p>':''}<p class="field-help">每次仅生成当前图位。请求可能产生费用；失败或超时不会自动重试，请先检查结果再决定是否重做。生成后仍须人工核对商品一致性与 Ozon 图片要求。</p>${state.imageGenerationInProgress?.product===state.product?`<p class="flow-status" role="status">${esc(state.imageGenerationInProgress.display)} 正在生成图位 ${esc(state.imageGenerationInProgress.slot)}，请勿重复点击。</p>`:''}`}
function sourceValue(value,key=''){
    if(value==null||value==='')return '<span class="muted">—</span>';
    if(Array.isArray(value)){
        if(!value.length)return '<span class="muted">—</span>';
        if(/图片|image/i.test(key)&&value.every(sourceSafeUrl))return `<div class="source-cell-media">${value.map((item,i)=>`<a href="${esc(sourceSafeUrl(item))}" target="_blank" rel="noopener noreferrer" title="${esc(item)}"><img src="${esc(sourceSafeUrl(item))}" alt="${esc(key)} ${i+1}" loading="lazy"></a>`).join('')}</div>`;
        return value.map((item)=>sourceValue(item,key)).join('<br>');
    }
    if(typeof value==='object')return esc(JSON.stringify(value));
    const url=sourceSafeUrl(value);
    return url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`:esc(value);
}
function sourceDisplayColumns(){return state.sourceColumns.filter(key=>key!=='col_0'&&!/(链接|图片)$/.test(key))}
function sourceReportCell(raw,key){
    const images=Array.isArray(raw?.[`${key}图片`])?raw[`${key}图片`].filter(sourceSafeUrl):[];
    const links=Array.isArray(raw?.[`${key}链接`])?raw[`${key}链接`].filter(sourceSafeUrl):[];
    const value=raw?.[key],body=(value==null||value==='')&&(images.length||links.length)?'':sourceValue(value,key);
    const gallery=images.length?`<div class="source-cell-media">${images.map((url,i)=>`<a href="${esc(sourceSafeUrl(url))}" target="_blank" rel="noopener noreferrer" title="${esc(url)}"><img src="${esc(sourceSafeUrl(url))}" alt="${esc(key)}图片 ${i+1}" loading="lazy"></a>`).join('')}</div>`:'';
    const link=links.length?links.length===1?`<a class="source-asset-count" href="${esc(sourceSafeUrl(links[0]))}" target="_blank" rel="noopener noreferrer">查看来源链接 ↗</a>`:`<span class="source-asset-count">${links.length} 个链接 · 查看整行可逐个打开</span>`:'';
    return body+gallery+link;
}
function renderSource(){
    const datasets=[['categories','类目报表'],['keywords','关键词报表'],['products','商品报表']];
    const start=state.sourceTotal?state.sourceOffset+1:0,end=Math.min(state.sourceOffset+state.sourceRecords.length,state.sourceTotal);
    const open=state.sourceRecords.find(x=>String(x.id)===String(state.sourceOpenId));
    const displayColumns=sourceDisplayColumns();
    $('#main').innerHTML=title('Seerfar 原始报表','按采集时可见的字段查看入库记录；推荐评分与原始值分开展示。')+
    `<div class="panel"><div class="source-dataset-tabs" role="tablist" aria-label="Seerfar 报表类型">${datasets.map(([key,label])=>`<button role="tab" aria-selected="${state.sourceDataset===key}" class="${state.sourceDataset===key?'on':''}" data-action="source-dataset" data-dataset="${key}">${label}</button>`).join('')}</div>
    <p class="source-note">只展示已采集入库的可见列，保留 Seerfar 原值、单位、图片/链接和采集时间。左右滚动表格可看全列；扩展提取的图片与链接合并在对应列，点击“查看整行”可核对全部原始字段。空值不会补造。</p>
    <div class="source-toolbar"><label class="field">数据来源<select id="sourceProvider"><option value="seerfar">Seerfar</option></select></label><label class="field">搜索字段值<input id="sourceQuery" value="${esc(state.sourceQuery)}" placeholder="关键词、类目、商品或原始字段"></label><label class="field">报表月份<input id="sourcePeriod" type="month" value="${esc(state.sourcePeriod)}"></label><label class="field">类目关联键<input id="sourceCategory" value="${esc(state.sourceCategory)}" placeholder="可选，精确匹配"></label><button class="btn" data-action="source-filter">查询</button></div>
    <div class="source-summary"><span>已入库匹配 <strong>${n(state.sourceTotal)}</strong> 行</span><span>当前 ${n(start)}–${n(end)} 行</span><span>原始字段 ${n(state.sourceColumns.length)} 项</span>${state.sourceLoading?'<span>读取中…</span>':''}</div>
    ${state.sourceError?`<div class="hint danger">读取失败：${esc(state.sourceError)}</div>`:''}

    if(typeof listingFlow!=='undefined'&&(listingFlow.busy||listingFlow.skuDrafts.has(product)||listingFlow.factDrafts.has(product)))throw Error('先完成正在运行的步骤并确认最新规格与商品事实，不能按旧资料付费生图');
    if(!confirm(`确认调用 ${display} 生成当前图位「${slot}」？\n请求 ${backend.aspect_ratio}${backend.image_size?` / ${backend.image_size.toUpperCase()}`:''}，保存为 ${backend.normalized_size}。\n这会产生模型费用。失败或超时不会自动重试；生成图片仍需人工审核。`))return;
    state.imageGenerationInProgress={product,slot,display};
    for(const button of document.querySelectorAll('[data-action="generate-slot"]'))button.disabled=true;
    const previousLabel=b.textContent;b.textContent=`${backend.label} 生成中…`;
    try{notice(`${display} 正在生成当前图位，请勿重复点击`);await api(`/api/workbench/products/${product}/guided/generate-image`,json('POST',{slot}));notice(`${display} 已生成 ${product} 的本张图，请人工检查图片`);if(product===state.product)await refreshProduct()}
    catch(error){throw Error(`${display}：${error.message}；不会自动重试。若请求已发出，可能已产生费用，请先检查图位结果`)}
    finally{state.imageGenerationInProgress=null;if(b.isConnected)b.textContent=previousLabel;for(const button of document.querySelectorAll('[data-action="generate-slot"]'))button.disabled=!(imageBackendReady()&&state.guided.review?.sections.image_plan.approved);if(product===state.product)document.querySelectorAll('[data-image-backend]').forEach(element=>element.parentElement.querySelector('.flow-status[role="status"]')?.remove())}
}
if(act==='approve'){if(productDraft()?.dirty&&b.dataset.section==='fields')throw Error('请先保存商品资料，再确认上架字段');if(b.dataset.section==='copy'&&[...productDraft()?.pending||[]].some(x=>x==='copyTitle'||x==='copyDescription'))throw Error('请先保存文案修改，再确认文案');if(b.dataset.section==='image_plan'&&[...productDraft()?.pending||[]].some(x=>/^(prompt|refs):/.test(x)))throw Error('请先保存图位修改，再确认图片规划');if(b.dataset.section==='fields'&&listingDraft()?.dirty)throw Error('请先保存官方属性草稿，再确认上架字段');await api(`/api/workbench/products/${state.product}/guided/approve`,json('POST',{section:b.dataset.section}));notice(`${sectionName[b.dataset.section]}已确认`);await refreshProduct()}
if(act==='preflight'){if(productDraft()?.dirty||productDraft()?.pending?.size)throw Error('请先保存当前未保存的商品资料、文案、售价或图位，再运行预检');const store=selectedReadStore();if(!store)throw Error('没有可用 Ozon 店铺，请先授权并选择读取店铺');if(listingDraft()?.dirty)throw Error('请先保存官方属性草稿，再运行提交前预检');const r=await api(`/api/workbench/products/${state.product}/preflight`,json('POST',{store:store.id}));(productEditor.step==='preview'?$('#previewPreflight'):$('#preflight')).innerHTML=`<pre>${esc(JSON.stringify(r.report,null,2))}</pre>`}
}catch(err){notice(err.message,true)}finally{if(b.isConnected)b.disabled=act==='generate-slot'?!(imageBackendReady()&&state.guided.review?.sections.image_plan.approved&&!state.imageGenerationInProgress):false}});
const opportunityState={items:[],total:0,all_count:0,counts:{},categories:[],status:'recommended',category:'',q:'',offset:0,limit:50,loading:false,error:'',open:null};
const opportunityLabels={recommended:'推荐研究',watch:'继续观察',pending:'待核验',excluded:'不符合条件'};
function renderOpportunities(){
    const s=opportunityState,open=s.items.find(x=>String(x.id)===String(s.open));
    $('#main').innerHTML=title('商品机会库','Ozon 竞品研究库，与 1688 待上架商品分开；直接使用已采集数据，不增加 API 调用费用。')+`<div class="panel">
    <div class="source-summary" style="margin-bottom:14px">已采集 <strong>${n(s.all_count)}</strong> 件 · 推荐 <strong>${n(s.counts.recommended||0)}</strong> · 待核验 <strong>${n(s.counts.pending||0)}</strong> · 观察 <strong>${n(s.counts.watch||0)}</strong> · 不符合 <strong>${n(s.counts.excluded||0)}</strong></div>
    <div class="source-toolbar op-toolbar"><label class="field">筛选状态<select id="opStatus">${Object.entries({recommended:'推荐研究',all:'全部已采集商品',pending:'待核验',watch:'继续观察',excluded:'不符合条件'}).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">类目<select id="opCategory"><option value="">所有类目</option>${s.categories.map(k=>`<option value="${esc(k)}" ${s.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label><label class="field">商品 / SKU<input id="opQuery" value="${esc(s.q)}" placeholder="输入名称或 SKU"></label><button class="btn" data-op-action="filter" ${s.loading?'disabled':''}>筛选 / 刷新</button></div>
    <p class="source-note">推荐规则：上架 &lt;90 天、销量 &gt;0；类目竞争密度处于同口径采集样本较低的 40%，商品评论数不高于同类目样本中位水平，机会分 ≥60。商品快照超过 14 天需复核。缺少数据不等于低竞争。</p>
    ${s.error?`<div class="hint danger">${esc(s.error)}</div>`:s.loading?'<div class="empty">正在读取商品机会…</div>':!s.items.length?`<div class="empty">${s.all_count?'当前没有符合筛选的商品。可切换“全部已采集商品”查看数据和未推荐原因。':'还没有商品报表。请在 Seerfar「热销榜单 / 商品库」显示上架时间、销量、评论数、类目等指标后，用插件采集；这里会自动分析。'}</div>`:`<div class="source-tablewrap"><table class="source-table"><thead><tr><th>判断</th><th style="min-width:280px">商品 / SKU</th><th>类目</th><th>上架天数</th><th>销量</th><th>评论 / 评分</th><th>类目竞争密度</th><th>机会分</th><th>采集日期</th><th>依据</th></tr></thead><tbody>${s.items.map(x=>`<tr><td><span class="tag ${x.status==='recommended'?'ok':'warn'}">${opportunityLabels[x.status]}</span></td><td>${x.image_url&&sourceSafeUrl(x.image_url)?`<img src="${esc(sourceSafeUrl(x.image_url))}" alt="商品缩略图" loading="lazy" style="width:48px;height:48px;object-fit:cover;float:left;margin-right:8px">`:''}<b>${esc(x.title||'未提供商品名称')}</b><br><span class="muted">SKU ${esc(x.sku)}</span><br>${x.product_url?`<a href="${esc(x.product_url)}" target="_blank" rel="noopener noreferrer">打开 Ozon 商品卡 ↗</a>`:'<span class="muted">缺少可用商品卡链接</span>'}</td><td>${esc(x.category_key||'未提供')}</td><td>${n(x.age_days)}</td><td>${n(x.sales)}</td><td>${n(x.reviews)} / ${n(x.rating)}</td><td>${n(x.competition_density)}</td><td class="score">${n(x.score)}</td><td>${esc(x.captured_at.slice(0,10))}</td><td><button class="btn ghost small" data-op-action="detail" data-id="${x.id}">查看判断与原始数据</button></td></tr>`).join('')}</tbody></table></div>`}
    ${open?`<section class="source-row-detail"><div class="row between"><h2>SKU ${esc(open.sku)} · ${opportunityLabels[open.status]}</h2><button class="btn ghost small" data-op-action="close">收起</button></div><ul class="statuslist">${[...open.reasons,...open.warnings].map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p class="muted">上架依据：${esc(open.age_basis)} · 商品证据行 ${open.id} · 类目证据行 ${n(open.competition_evidence_id)} · ${esc(open.period_kind==='rolling_30d'?'最近 30 天快照':'自然月报表')} ${esc(open.period)}</p><dl class="source-detail-grid">${Object.entries(open.raw).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${sourceValue(v,k)}</dd></div>`).join('')}</dl></section>`:''}
    <div class="source-pager"><span class="muted">${s.total?n(s.offset+1):0}–${n(Math.min(s.offset+s.items.length,s.total))} / ${n(s.total)} 件 · 按判断与机会分排序</span><div class="row"><button class="btn ghost small" data-op-action="prev" ${s.offset===0||s.loading?'disabled':''}>上一页</button><button class="btn ghost small" data-op-action="next" ${s.offset+s.limit>=s.total||s.loading?'disabled':''}>下一页</button></div></div></div>`;
}
async function loadOpportunities(){const s=opportunityState,seq=loadOpportunities.seq=(loadOpportunities.seq||0)+1;s.loading=true;s.error='';if(state.view==='opportunities')render();try{const r=await api('/api/research/product-opportunities?'+new URLSearchParams({status:s.status,category_key:s.category,q:s.q,limit:s.limit,offset:s.offset}));if(seq!==loadOpportunities.seq)return;Object.assign(s,r,{open:null})}catch(e){if(seq!==loadOpportunities.seq)return;s.error=e.message;s.items=[]}finally{if(seq===loadOpportunities.seq){s.loading=false;if(state.view==='opportunities')render()}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-op-action]');if(!b)return;const s=opportunityState,a=b.dataset.opAction;if(a==='detail'){s.open=b.dataset.id;renderOpportunities();return}if(a==='close'){s.open=null;renderOpportunities();return}if(a==='filter'){s.status=$('#opStatus').value;s.category=$('#opCategory').value;s.q=$('#opQuery').value.trim();s.offset=0}if(a==='prev')s.offset=Math.max(0,s.offset-s.limit);if(a==='next')s.offset+=s.limit;await loadOpportunities()});
async function startWorkbench(){await load();const productId=new URLSearchParams(location.search).get('product_id');if(productId&&/^P\d{6}$/.test(productId)){try{await fetchProduct(productId)}catch(e){notice('采集商品读取失败：'+e.message,true)}}}
startWorkbench();

<script>
// One editing workbench, plus a separate read-only operations surface.
const beforeOperationsRender=render;
render=function(){
  if(window.ShopManager?.isBusy?.() && state.view!=='stores'){
    state.view='stores';activate();window.ShopManager.canLeave();return;
  }
  if(state.view!=='stores')window.ShopManager?.unmount?.();
  if(state.view==='stores'){
    window.OperationsCenter?.unmount?.();
    document.body.classList.remove('operations-mode','product-mode');
    $('#main').classList.remove('operations-page','source-page','product-page');
    activate();
    if($('#main').classList.contains('shop-manager'))return;
    window.ShopManager.mount($('#main'),{onSaved:()=>refreshStores()});
    return;
  }
  if(state.view!=='operations'){
    window.OperationsCenter?.unmount?.();
    document.body.classList.remove('operations-mode');
    $('#main').classList.remove('operations-page');
    return beforeOperationsRender();
  }
  document.body.classList.remove('product-mode');
  document.body.classList.add('operations-mode');
  $('#main').classList.remove('source-page','product-page');
  $('#main').classList.add('operations-page');
  activate();
  $('#evidence').innerHTML='<p>按店铺和货号独立保存官方监测数据。数据有统计延迟，缺项不当作零。</p><p>首版只读：不会自动改卡、开广告或调整出价。广告需要单独授权 Performance API。</p><p>当前为共享工作台访问，尚无员工账号权限隔离。</p>';
  window.OperationsCenter.mount($('#main'));
};
