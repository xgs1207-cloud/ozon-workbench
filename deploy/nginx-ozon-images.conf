# Ozon 图片静态站点（腾讯云服务器，nginx）
#
# 作用：让 Ozon 能通过 **https** 抓到我们生成的商品图片。
# 目录约定：/var/www/ozon-images/<product_id>/<slot>.png
#   由 `python -m pipeline.oss_local --root /var/www/ozon-images --base-url https://img.example.com`
#   写入；同时写出 output/image-public-urls.json 供上传载荷使用。
#
# 安装：
#   sudo cp deploy/nginx-ozon-images.conf /etc/nginx/conf.d/ozon-images.conf
#   sudo sed -i 's/img.example.com/你的域名/' /etc/nginx/conf.d/ozon-images.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name img.example.com;
    # 强制 HTTPS：Ozon 拉取图片走 https，我们的上传门禁也只接受 https 地址
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name img.example.com;

    # 证书：Let's Encrypt（certbot）或腾讯云免费证书
    ssl_certificate     /etc/letsencrypt/live/img.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/ozon-images;
    index none;

    # 只读：不列目录、不允许上传
    autoindex off;
    client_max_body_size 1m;

    location / {
        try_files $uri =404;
    }

    # 图片是内容寻址的（同一 slot 变了才换文件名/内容），给较长缓存
    location ~* \.(png|jpe?g|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # 明确拒绝脚本与隐藏文件
    location ~ /\. { deny all; }
    location ~* \.(php|py|sh|pl|cgi)$ { deny all; }
}
