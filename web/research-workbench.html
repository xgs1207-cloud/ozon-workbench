<style>
:root{--blue:#1557e8;--navy:#1c2b45;--muted:#65748c;--line:#dce4f0;--bg:#f4f7fb;--white:#fff;--good:#087f5b;--warn:#a86300;--bad:#b42332;--radius:12px;font-family:Inter,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--navy)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--blue)}:focus-visible{outline:3px solid #74a3ff;outline-offset:2px}
.top{height:62px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-size:18px;font-weight:760;letter-spacing:-.03em}.brand i{display:inline-block;background:var(--blue);width:9px;height:22px;border-radius:2px;margin-right:9px;vertical-align:-5px}.top a{font-size:13px}.shell{display:grid;grid-template-columns:208px minmax(480px,1fr) 270px;min-height:calc(100vh - 62px)}.rail{background:#eaf0fa;border-right:1px solid var(--line);padding:24px 12px}.rail p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;margin:0 12px 15px}.rail button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px;border-radius:8px;color:var(--navy);margin-bottom:5px}.rail button.on{background:var(--white);color:var(--blue);font-weight:700;box-shadow:0 1px 5px #29486c10}.num{width:24px;height:24px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:12px}.main{padding:28px 32px 60px;max-width:1350px;width:100%;margin:0 auto}.aside{background:var(--white);border-left:1px solid var(--line);padding:25px 19px}.aside h3{font-size:14px;margin:0 0 15px}.aside p,.aside li{font-size:12px;line-height:1.65;color:var(--muted)}.aside ul{padding-left:18px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.13em;color:var(--blue);text-transform:uppercase}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}.head h1{font-size:28px;letter-spacing:-.045em;line-height:1.15;margin:7px 0}.head p{color:var(--muted);margin:4px 0;font-size:13px}.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #283f6008}.panel h2{font-size:17px;margin:0 0 13px;letter-spacing:-.02em}.panel h3{font-size:14px;margin:18px 0 10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:block;font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select,input.text,select.text{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px;color:var(--navy);outline:none}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}.btn{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:7px;padding:9px 13px;font-weight:650;min-height:36px}.btn.secondary{background:white;color:var(--blue)}.btn.ghost{background:white;border-color:var(--line);color:var(--navy)}.btn.small{padding:5px 8px;font-size:12px;min-height:28px}.muted{color:var(--muted);font-size:12px}.hint{border-left:3px solid var(--blue);background:#f1f6ff;padding:10px 12px;font-size:12px;line-height:1.6;margin:10px 0}.warn{border-left-color:var(--warn);background:#fff8e9}.danger{border-left-color:var(--bad);background:#fff1f2}.good{color:var(--good)}.bad{color:var(--bad)}.tag{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;background:#eaf1ff;color:#1644a6}.tag.ok{background:#e4f5ee;color:var(--good)}.tag.warn{background:#fff1d6;color:var(--warn)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:650;background:#f7f9fd}th,td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#f9fbff}.score{font-variant-numeric:tabular-nums;font-weight:780;color:var(--blue)}.sectionline{border:0;border-top:1px solid var(--line);margin:18px 0}.checkrow{display:flex;gap:10px;align-items:start;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}.checkrow input{margin-top:4px}.slot{display:grid;grid-template-columns:100px 1fr;gap:12px;border-top:1px solid var(--line);padding:14px 0}.slot img,.thumb{width:94px;height:120px;object-fit:cover;border-radius:7px;background:#e5ecf7}.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs label{font-size:11px;display:flex;flex-direction:column;align-items:center}.thumbs .thumb{width:68px;height:83px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;background:var(--navy);color:white;padding:10px 16px;border-radius:7px;box-shadow:0 10px 25px #1c2b4540;max-width:min(650px,90vw)}.empty{padding:28px;color:var(--muted);font-size:13px;text-align:center;border:1px dashed var(--line);border-radius:9px}.statuslist{padding-left:18px;font-size:12px;color:var(--muted)}.statuslist li{margin-bottom:6px}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f7f9fd;padding:10px;border-radius:7px}
@media(max-width:1150px){.shell{grid-template-columns:190px 1fr}.aside{grid-column:2;border-left:0;border-top:1px solid var(--line)}}@media(max-width:720px){.top{padding:0 12px}.shell{display:block}.rail{display:flex;overflow:auto;padding:7px;border-right:0}.rail p{display:none}.rail button{white-space:nowrap;width:auto;padding:8px}.main{padding:18px 12px}.aside{padding:16px}.grid2,.grid4{grid-template-columns:1fr}.slot{grid-template-columns:1fr}}
.field .row{flex-wrap:nowrap}.field .row .skuPrice{flex:1;min-width:90px}.field .row .priceCurrency{width:84px;flex:none}
.source-page{max-width:none}.source-page .head{margin-bottom:15px}.source-toolbar{display:grid;grid-template-columns:160px minmax(160px,1fr) 130px minmax(170px,1fr) auto;align-items:end;gap:10px;margin-bottom:14px}.source-toolbar .field{min-width:0}.source-toolbar .field input,.source-toolbar .field select{margin-top:5px}.source-summary{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.source-summary strong{color:var(--navy);font-variant-numeric:tabular-nums}.source-tablewrap{overflow:auto;max-height:min(68vh,780px);border:1px solid var(--line);border-radius:8px;overscroll-behavior:contain}.source-table{width:max-content;min-width:100%;font-size:12px}.source-table th{position:sticky;top:0;z-index:2;background:#eaf0f8;white-space:nowrap}.source-table th,.source-table td{border-right:1px solid #e8edf4;padding:9px 11px;min-width:130px;max-width:300px;overflow-wrap:anywhere;white-space:pre-wrap}.source-table th:first-child,.source-table td:first-child{position:sticky;left:0;min-width:92px;max-width:92px;z-index:1;background:#fff}.source-table th:first-child{z-index:3;background:#eaf0f8}.source-table tr:nth-child(even) td{background:#fbfcfe}.source-table tr:nth-child(even) td:first-child{background:#fbfcfe}.source-table tr:hover td,.source-table tr:hover td:first-child{background:#eef5ff}.source-table .source-cell-media{display:flex;gap:5px;flex-wrap:wrap;max-width:270px;margin-top:5px}.source-table .source-cell-media img{width:45px;height:45px;object-fit:cover;border:1px solid var(--line);border-radius:4px}.source-table a{overflow-wrap:anywhere}.source-asset-count{display:inline-block;margin-top:4px;font-size:11px;color:var(--blue)}.source-dataset-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow:auto}.source-dataset-tabs button{border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:13px;padding:10px 13px;white-space:nowrap}.source-dataset-tabs button.on{color:var(--blue);border-color:var(--blue);font-weight:750}.source-row-detail{margin-top:15px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;padding:15px;background:#fbfdff}.source-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}.source-detail-grid div{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}.source-detail-grid dt{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.source-detail-grid dd{font-size:12px;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.source-pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.source-pager .row{flex-wrap:nowrap}.source-note{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 13px}.source-url{max-width:350px;overflow-wrap:anywhere}
@media(max-width:1250px){.source-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.source-toolbar .btn{align-self:end}}@media(max-width:720px){.source-toolbar{grid-template-columns:1fr}.source-pager{align-items:start;flex-direction:column}.source-page .panel{padding:14px}}
.source-toolbar.op-toolbar{grid-template-columns:180px minmax(160px,1fr) minmax(180px,1fr) auto}@media(max-width:1250px){.source-toolbar.op-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.source-toolbar.op-toolbar{grid-template-columns:1fr}}
.sku-catalog{max-height:560px;overflow:auto;margin-top:12px;border-top:1px solid var(--line);overscroll-behavior:contain}.sku-row{align-items:center;padding:12px 4px;min-width:0}.sku-row>span{min-width:0;overflow-wrap:anywhere;line-height:1.6}.sku-row img{width:64px;height:64px;object-fit:contain;border:1px solid var(--line);background:#fff;border-radius:5px;flex:none}.sku-row input{flex:none}.sku-row:has(input:checked){background:#f1f6ff}.sku-details{display:block}.sku-footer{margin-top:14px;justify-content:space-between}.sku-filter{max-width:420px}.sku-row[hidden]{display:none}
</style>
</head>
<body>
<header class="top"><div class="brand"><i></i>Ozon 上品工作台</div><div class="row"><span class="muted" id="health">读取中</span><a href="/advanced">高级操作台</a></div></header>
<div class="shell"><nav class="rail" aria-label="工作流程"><p>工作流程</p><button data-view="categories" class="on"><span class="num">1</span> 类目机会</button><button data-view="source"><span class="num">源</span> Seerfar 原始报表</button><button data-view="opportunities"><span class="num">商</span> 商品机会库</button><button data-view="keywords"><span class="num">2</span> 关键词决策</button><button data-view="sessions"><span class="num">3</span> 1688 商品批次</button><button data-view="product"><span class="num">4</span> 上架审核</button></nav><main id="main" class="main" aria-live="polite"></main><aside class="aside"><h3>当前决策依据</h3><div id="evidence">先选择一个类目，查看各项评分和源数据。</div><hr class="sectionline"><h3>工作台边界</h3><ul><li>Seerfar 类目仅用于选品，不是 Ozon 上架类目。</li><li>Ozon API 只读取真实类目与属性；商品卡写入需逐项确认及批次开关。</li><li>豆包火山方舟的文案和生图会产生调用费用，生图按图位逐张启动。</li><li>“提交成功”不等于“已开售”；需以 Ozon 审核及库存状态为准。</li></ul></aside></div><div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'categories',category:null,primary:null,secondary:new Set(),session:null,product:null,stores:[],categories:[],keywords:[],sessions:[],products:[],guided:null,skus:null,ozonResults:[],attempts:[],sourceRecords:[],sourceColumns:[],sourceTotal:0,sourceDataset:'categories',sourceOffset:0,sourceLimit:50,sourceQuery:'',sourcePeriod:'',sourceCategory:'',sourceLoading:false,sourceError:'',sourceOpenId:null};
const n=v=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
function notice(msg,bad=false){const el=$('#toast');el.textContent=msg;el.style.background=bad?'#9b2331':'#1c2b45';el.hidden=false;clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.hidden=true,5500)}
async function api(path,opts={}){const response=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});let body;try{body=await response.json()}catch{body={detail:'服务器返回了非 JSON 响应'}}if(!response.ok)throw Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail||body));return body}
const json=(method,body)=>({method,body:JSON.stringify(body)});
function title(label,sub){return `<div class="head"><div><div class="eyebrow">RESEARCH → LISTING</div><h1>${label}</h1><p>${sub}</p></div></div>`}
function activate(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));renderEvidence()}
async function load(){try{const [cats,sessions,products,stores]=await Promise.all([api('/api/research/categories'),api('/api/research/sessions'),api('/api/collector/products'),api('/api/workbench/stores')]);state.categories=cats.items;state.sessions=sessions.items;state.products=products.items;state.stores=stores.shops;$('#health').textContent='已连接 · '+cats.recommended_count+' 个推荐类目';render()}catch(e){$('#health').textContent='连接异常';$('#main').innerHTML=title('暂时无法加载',esc(e.message))+'<div class="panel">请检查服务、数据库及登录状态。</div>'}}
function renderEvidence(){if(state.view==='source'){$('#evidence').innerHTML='<p>这里显示已入库的 Seerfar 可见报表原值。它们是采集证据，不是 Ozon 官方类目，也不等于推荐结论。</p><p>点击“查看整行”可核对原始字段、采集时间与来源页。</p>';return}const row=state.view==='keywords'?state.keywords.find(x=>x.key===state.primary):state.categories.find(x=>x.key===state.category);$('#evidence').innerHTML=row?`<div class="score" style="font-size:26px">${n(row.score)} <small style="font-size:12px;color:var(--muted)">/ 100</small></div><p>${esc(row.label)} · ${esc(row.confidence==='high'?'高可信':'有限可信')}</p><ul>${row.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>同源月度观察：${n(row.metrics.history_months)} 期<br>最新：${esc(row.metrics.latest_period)}<br>证据行 ID：${esc(row.metrics.evidence_ids.join(', '))}</p>`:'<p>先选择类目或主词，查看评分解释与数据来源。</p>'}
function render(){$('#main').classList.toggle('source-page',['source','opportunities'].includes(state.view));activate();({categories:renderCategories,source:renderSource,opportunities:renderOpportunities,keywords:renderKeywords,sessions:()=>{renderSessions();$('#main').insertAdjacentHTML('beforeend',renderCollectedProducts())},product:renderProduct})[state.view]();if(state.view==='opportunities')$('#evidence').innerHTML='<p>商品必须上架不足 90 天且销量大于 0。竞争密度来自已采集类目报表；评论数只衡量评价壁垒。</p><p>同口径类目和同类目商品分别至少 5 个；缺字段或过期快照列入“待核验”。只比较采集样本，不代表全市场。</p><p>退货取消率仅扣分。机会分不是利润承诺；商品卡可跳转 Ozon 查看。</p>';if(state.view==='sessions'&&state.session)refreshAttempts();if(state.view==='product'&&state.guided)hydrateProductFields()}
function renderCollectedProducts(){return `<div class="panel"><h2>已采集的 1688 商品</h2><p class="muted">尚未关联研究批次也可以先选择规格；开始上架前再关联关键词批次。</p>${state.products.length?`<div class="tablewrap"><table><thead><tr><th>商品</th><th>采集名称</th><th>规格数</th><th></th></tr></thead><tbody>${state.products.map(x=>`<tr><td>${esc(x.product_id)}</td><td>${esc(x.title_zh||'未提供名称')}</td><td>${n(x.sku_count)}</td><td><button class="btn small" data-action="product" data-id="${esc(x.product_id)}">选择规格 / 审核</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">请先用插件采集 1688 商品，全部规格和图片会保存在这里。</div>'}</div>`}
function hydrateProductFields(){const g=state.guided,c=g.human_confirmations||{},dims=g.measurements?.product||{};if($('#factMaterial'))$('#factMaterial').value=c.material||'';if($('#factQuantity'))$('#factQuantity').value=c.package_quantity||'';document.querySelectorAll('.dim').forEach(x=>x.value=dims[`${x.dataset.kind}_${x.dataset.key}`]||'');const names=new Map((g.category_attributes?.attributes||[]).map(x=>[String(x.attribute_id),x.attribute_name]));document.querySelectorAll('.humanAttribute').forEach(x=>{const name=names.get(x.dataset.id);if(name)x.parentElement.firstChild.textContent=`${name} (${x.dataset.id})`})}
async function refreshAttempts(){try{const r=await api(`/api/research/sessions/${state.session}/publish-attempts`),el=$('#attempts');if(el)el.innerHTML=`<h3>自动提交记录</h3>${r.items.length?`<div class="tablewrap"><table><thead><tr><th>商品</th><th>店铺</th><th>结果</th><th>时间</th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${esc(x.product_id)}</td><td>${esc(x.store_id)}</td><td>${esc(x.state)}</td><td>${esc(x.attempted_at)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">暂无真实写入记录。</p>'}`}catch(e){const el=$('#attempts');if(el)el.textContent='读取提交记录失败：'+e.message}}
function renderCategories(){const rows=state.categories;$('#main').innerHTML=title('类目机会','只呈现数据库中已有的 Seerfar 观察；需求稳定、竞争较低优先，退货/取消率仅扣分。')+`<div class="panel"><div class="row between"><h2>候选类目 <span class="tag">${rows.filter(x=>x.recommended).length} 个推荐</span></h2><button class="btn ghost small" data-action="config">调整筛选规则</button></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>类目</th><th>机会分</th><th>需求均值</th><th>稳定度</th><th>竞争密度</th><th>历史</th><th>决策</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.label)}</b><br><span class="muted">${esc(x.key)}</span></td><td class="score">${n(x.score)}</td><td>${n(x.metrics.demand)}</td><td>${n(x.metrics.stability)}</td><td>${n(x.metrics.competition_density)}</td><td>${x.metrics.history_months} 月</td><td>${x.recommended?`<button class="btn small" data-action="category" data-key="${esc(x.key)}">查看关键词</button>`:`<span class="tag warn" title="${esc(x.warnings.join('；'))}">证据不足</span>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有可分析的类目数据。先通过插件或文件导入 Seerfar 月度快照；系统不会编造推荐。</div>'}</div><div id="settings"></div>`}
function sourceSafeUrl(value){try{const url=new URL(String(value));return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
function sourceValue(value,key=''){
    if(value==null||value==='')return '<span class="muted">—</span>';
    if(Array.isArray(value)){
        if(!value.length)return '<span class="muted">—</span>';
        if(/图片|image/i.test(key)&&value.every(sourceSafeUrl))return `<div class="source-cell-media">${value.map((item,i)=>`<a href="${esc(sourceSafeUrl(item))}" target="_blank" rel="noopener noreferrer" title="${esc(item)}"><img src="${esc(sourceSafeUrl(item))}" alt="${esc(key)} ${i+1}" loading="lazy"></a>`).join('')}</div>`;
        return value.map((item)=>sourceValue(item,key)).join('<br>');
    }
    if(typeof value==='object')return esc(JSON.stringify(value));
    const url=sourceSafeUrl(value);
    return url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(value)}</a>`:esc(value);
}
function sourceDisplayColumns(){return state.sourceColumns.filter(key=>key!=='col_0'&&!/(链接|图片)$/.test(key))}
function sourceReportCell(raw,key){
    const images=Array.isArray(raw?.[`${key}图片`])?raw[`${key}图片`].filter(sourceSafeUrl):[];
    const links=Array.isArray(raw?.[`${key}链接`])?raw[`${key}链接`].filter(sourceSafeUrl):[];
    const value=raw?.[key],body=(value==null||value==='')&&(images.length||links.length)?'':sourceValue(value,key);
    const gallery=images.length?`<div class="source-cell-media">${images.map((url,i)=>`<a href="${esc(sourceSafeUrl(url))}" target="_blank" rel="noopener noreferrer" title="${esc(url)}"><img src="${esc(sourceSafeUrl(url))}" alt="${esc(key)}图片 ${i+1}" loading="lazy"></a>`).join('')}</div>`:'';
    const link=links.length?links.length===1?`<a class="source-asset-count" href="${esc(sourceSafeUrl(links[0]))}" target="_blank" rel="noopener noreferrer">查看来源链接 ↗</a>`:`<span class="source-asset-count">${links.length} 个链接 · 查看整行可逐个打开</span>`:'';
    return body+gallery+link;
}
function renderSource(){
    const datasets=[['categories','类目报表'],['keywords','关键词报表'],['products','商品报表']];
    const start=state.sourceTotal?state.sourceOffset+1:0,end=Math.min(state.sourceOffset+state.sourceRecords.length,state.sourceTotal);
    const open=state.sourceRecords.find(x=>String(x.id)===String(state.sourceOpenId));
    const displayColumns=sourceDisplayColumns();
    $('#main').innerHTML=title('Seerfar 原始报表','按采集时可见的字段查看入库记录；推荐评分与原始值分开展示。')+

async function refreshProduct(){await fetchProduct(state.product)}
document.addEventListener('input',e=>{if(e.target.id==='skuFilter'){const query=e.target.value.trim().toLowerCase();document.querySelectorAll('.sku-row').forEach(row=>row.hidden=!row.dataset.skuSearch.includes(query))}});
document.addEventListener('change',e=>{if(e.target.classList.contains('skuChoice')){let count=document.querySelectorAll('.skuChoice:checked').length;if(count>10){e.target.checked=false;count--;notice('一次最多选择 10 个上架规格，其他规格仍保留在后台',true)}$('#skuSelectedCount').textContent=`已勾选 ${count} / ${state.skus.skus.length} · 最多 10 个`}if(e.target.name==='primary'){state.primary=e.target.value;state.secondary.delete(e.target.value);render()}if(e.target.classList.contains('secondary')){e.target.checked?state.secondary.add(e.target.value):state.secondary.delete(e.target.value);if(state.secondary.size>10){state.secondary.delete(e.target.value);notice('辅词最多 10 个',true)}render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-view],[data-action]');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();if(state.view==='source')await loadSource();if(state.view==='opportunities')await loadOpportunities();return}const act=b.dataset.action;try{b.disabled=true;
if(act==='source-dataset'){state.sourceDataset=b.dataset.dataset;state.sourceOffset=0;await loadSource()}
if(act==='source-filter'){state.sourceQuery=$('#sourceQuery').value.trim();state.sourcePeriod=$('#sourcePeriod').value;state.sourceCategory=$('#sourceCategory').value.trim();state.sourceOffset=0;await loadSource()}
if(act==='source-prev'){state.sourceOffset=Math.max(0,state.sourceOffset-state.sourceLimit);await loadSource()}
if(act==='source-next'){state.sourceOffset+=state.sourceLimit;await loadSource()}
if(act==='source-row'){state.sourceOpenId=String(state.sourceOpenId)===String(b.dataset.id)?null:b.dataset.id;renderSource();if(state.sourceOpenId)$('#sourceRowDetail')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
if(act==='category'){state.category=b.dataset.key;state.primary=null;state.secondary.clear();state.keywords=(await api('/api/research/keywords?category_key='+encodeURIComponent(state.category))).items;state.view='keywords';render()}
if(act==='config'){const c=(await api('/api/research/config')).config;$('#settings').innerHTML=`<div class="panel"><h2>筛选规则</h2><div class="grid4"><label class="field">最少历史月数<input id="cfgMonths" type="number" min="1" max="12" value="${c.min_history_months}"></label><label class="field">需求最低值<input id="cfgDemand" type="number" min="0" value="${c.min_demand}"></label><label class="field">竞争密度上限（留空=不硬筛）<input id="cfgCompetition" type="number" min="0" step="0.001" value="${c.max_competition_density??''}"></label><label class="field">退货扣分系数<input id="cfgReturns" type="number" min="0" max="30" value="${c.return_penalty}"></label></div><p class="muted">当前权重：类目稳定度 ${c.weights.categories.stability}、低竞争 ${c.weights.categories.competition}、需求 ${c.weights.categories.demand}、趋势 ${c.weights.categories.trend}；关键词稳定度 ${c.weights.keywords.stability}、低竞争 ${c.weights.keywords.competition}、需求 ${c.weights.keywords.demand}、转化 ${c.weights.keywords.conversion}。</p><button class="btn" data-action="save-config">保存规则</button></div>`}
if(act==='save-config'){const c=(await api('/api/research/config')).config;c.min_history_months=Number($('#cfgMonths').value);c.min_demand=Number($('#cfgDemand').value);c.max_competition_density=$('#cfgCompetition').value?Number($('#cfgCompetition').value):null;c.return_penalty=Number($('#cfgReturns').value);await api('/api/research/config',json('PUT',c));notice('规则已保存，推荐顺序将刷新');await load()}
if(act==='create-session'){const r=await api('/api/research/sessions',json('POST',{category_key:state.category,primary_keyword:state.primary,secondary_keywords:[...state.secondary]}));state.session=r.session.id;notice('选词批次已建立');await load();state.view='sessions';render()}
if(act==='session'){state.session=b.dataset.id;render()}
if(act==='attach'){const id=$('#attachProduct').value;if(!id)throw Error('请选择一个已采集商品');await api(`/api/research/sessions/${state.session}/products`,json('POST',{product_id:id}));notice('商品已关联，关键词和手工售价门槛已继承');await load();state.view='sessions';render()}
if(act==='product')await fetchProduct(b.dataset.id);
if(act==='auto-on'){const store=$('#publishStore').value;if(!store)throw Error('先选择店铺');if(!confirm('确认对本批次开启自动发布？全部审核通过后，会真实向所选 Ozon 店铺提交商品卡。'))return;await api(`/api/research/sessions/${state.session}/auto-publish`,json('PUT',{enabled:true,target_store_id:store,confirm:'ENABLE_AUTO_PUBLISH'}));notice('本批次自动发布已开启');await load();state.view='sessions';render()}
if(act==='auto-off'){await api(`/api/research/sessions/${state.session}/auto-publish`,json('PUT',{enabled:false}));notice('本批次自动发布已关闭');await load();state.view='sessions';render()}
if(act==='save-skus'){const include=[...document.querySelectorAll('.skuChoice:checked')].map(x=>x.value);if(!include.length)throw Error('至少选择一个 SKU');await api(`/api/workbench/products/${state.product}/skus`,json('POST',{include}));notice('SKU 选择已保存');await refreshProduct()}
if(act==='save-product-keywords'){const primary=$('#productPrimary').value.trim(),secondary=$('#productSecondary').value.split(',').map(x=>x.trim()).filter(Boolean);if(!primary)throw Error('请填写主词');await api(`/api/workbench/products/${state.product}/keywords`,json('PUT',{keywords:[{keyword:primary,role:'core'},...secondary.map(keyword=>({keyword,role:'secondary'}))]}));notice('本商品关键词已保存，文案审核需重新确认');await refreshProduct()}
if(act==='ozon-search'){const q=$('#ozonQuery').value.trim();const r=await api('/api/ozon/categories?q='+encodeURIComponent(q));state.ozonResults=r.items;$('#ozonResults').innerHTML=r.items.length?`<div class="tablewrap"><table><thead><tr><th>Ozon 类目路径</th><th>官方 ID</th><th></th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${esc(x.path.join(' / '))}</td><td>${x.category_id} / ${x.type_id}</td><td><button class="btn small" data-action="ozon-select" data-category="${x.category_id}" data-type="${x.type_id}">确认类目</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有找到匹配的真实末级类目。</div>'}
if(act==='ozon-select'){await api(`/api/workbench/products/${state.product}/ozon-category`,json('PUT',{category_id:Number(b.dataset.category),type_id:Number(b.dataset.type)}));notice('Ozon 官方类目已确认');await refreshProduct()}
if(act==='save-facts'){await api(`/api/workbench/products/${state.product}/guided/facts`,json('PUT',{material:$('#factMaterial').value.trim()||null,package_quantity:Number($('#factQuantity').value)||null}));notice('人工确认事实已保存；请重新运行豆包分析')}
if(act==='save-dimensions'){const body={product:{},package:{}};document.querySelectorAll('.dim').forEach(x=>body[x.dataset.kind][x.dataset.key]=Number(x.value));await api(`/api/workbench/products/${state.product}/measurements`,json('PUT',body));notice('尺寸重量已保存')}
if(act==='save-prices'){const prices=[...document.querySelectorAll('.skuPrice')].map(x=>({sku_id:x.dataset.sku,price:Number(x.value),currency:x.parentElement.querySelector('select').value}));await api(`/api/workbench/products/${state.product}/prices`,json('PUT',{prices}));notice('逐 SKU 售价已保存');await refreshProduct()}
if(act==='prepare'){const store=state.stores.find(x=>x.enabled&&x.credentials_ready);if(!store)throw Error('没有可用的 Ozon 店铺凭据');notice('豆包与 Ozon 只读准备中，可能需要几十秒');const r=await api(`/api/workbench/products/${state.product}/guided/prepare`,json('POST',{store:store.id}));notice(r.ok?'准备完成':`准备暂停：${r.report?.phases?.at(-1)?.warnings?.join('；')||r.report?.reason||'查看审核缺项'}`,!r.ok);await refreshProduct()}
if(act==='grouping'){await api(`/api/workbench/products/${state.product}/guided/grouping`,json('PUT',{strategy:b.dataset.strategy}));notice('SKU 分组已保存');await refreshProduct()}
if(act==='save-copy'){await api(`/api/workbench/products/${state.product}/guided/copy`,json('PUT',{title_ru:$('#copyTitle').value,description_ru:$('#copyDescription').value}));notice('文案已保存，之前的文案及图片确认可能失效');await refreshProduct()}
if(act==='save-slot'){const slot=b.dataset.slot,p=[...document.querySelectorAll('.slotPrompt')].find(x=>x.dataset.slot===slot),r=[...document.querySelectorAll('.slotRefs')].find(x=>x.dataset.slot===slot);await api(`/api/workbench/products/${state.product}/guided/image-plan/${encodeURIComponent(slot)}`,json('PUT',{prompt:p.value,reference_ids:r.value.split(',').map(x=>x.trim()).filter(Boolean)}));notice('图位计划已保存，请重新确认整套计划');await refreshProduct()}
if(act==='generate-slot'){if(!confirm('确认调用火山方舟生成这张图？这会产生模型费用。'))return;notice('豆包正在生成图片，请稍候');await api(`/api/workbench/products/${state.product}/guided/generate-image`,json('POST',{slot:b.dataset.slot}));notice('图位已生成，请人工检查图片');await refreshProduct()}
if(act==='approve'){await api(`/api/workbench/products/${state.product}/guided/approve`,json('POST',{section:b.dataset.section}));notice(`${sectionName[b.dataset.section]}已确认`);await refreshProduct()}
if(act==='save-attributes'){const attributes={};document.querySelectorAll('.humanAttribute').forEach(x=>{if(x.value.trim())attributes[x.dataset.id]=x.value.trim()});await api(`/api/workbench/products/${state.product}/guided/attributes`,json('PUT',{attributes}));notice('官方属性已重新编译');await refreshProduct()}
if(act==='preflight'){const store=state.stores.find(x=>x.enabled&&x.credentials_ready);if(!store)throw Error('没有可用 Ozon 店铺');const r=await api(`/api/workbench/products/${state.product}/preflight`,json('POST',{store:store.id}));$('#preflight').innerHTML=`<pre>${esc(JSON.stringify(r.report,null,2))}</pre>`}
}catch(err){notice(err.message,true)}finally{if(b.isConnected)b.disabled=false}});
const opportunityState={items:[],total:0,all_count:0,counts:{},categories:[],status:'recommended',category:'',q:'',offset:0,limit:50,loading:false,error:'',open:null};
const opportunityLabels={recommended:'推荐研究',watch:'继续观察',pending:'待核验',excluded:'不符合条件'};
function renderOpportunities(){
    const s=opportunityState,open=s.items.find(x=>String(x.id)===String(s.open));
    $('#main').innerHTML=title('商品机会库','Ozon 竞品研究库，与 1688 待上架商品分开；直接使用已采集数据，不增加 API 调用费用。')+`<div class="panel">
    <div class="source-summary" style="margin-bottom:14px">已采集 <strong>${n(s.all_count)}</strong> 件 · 推荐 <strong>${n(s.counts.recommended||0)}</strong> · 待核验 <strong>${n(s.counts.pending||0)}</strong> · 观察 <strong>${n(s.counts.watch||0)}</strong> · 不符合 <strong>${n(s.counts.excluded||0)}</strong></div>
    <div class="source-toolbar op-toolbar"><label class="field">筛选状态<select id="opStatus">${Object.entries({recommended:'推荐研究',all:'全部已采集商品',pending:'待核验',watch:'继续观察',excluded:'不符合条件'}).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">类目<select id="opCategory"><option value="">所有类目</option>${s.categories.map(k=>`<option value="${esc(k)}" ${s.category===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label><label class="field">商品 / SKU<input id="opQuery" value="${esc(s.q)}" placeholder="输入名称或 SKU"></label><button class="btn" data-op-action="filter" ${s.loading?'disabled':''}>筛选 / 刷新</button></div>
    <p class="source-note">推荐规则：上架 &lt;90 天、销量 &gt;0；类目竞争密度处于同口径采集样本较低的 40%，商品评论数不高于同类目样本中位水平，机会分 ≥60。商品快照超过 14 天需复核。缺少数据不等于低竞争。</p>
    ${s.error?`<div class="hint danger">${esc(s.error)}</div>`:s.loading?'<div class="empty">正在读取商品机会…</div>':!s.items.length?`<div class="empty">${s.all_count?'当前没有符合筛选的商品。可切换“全部已采集商品”查看数据和未推荐原因。':'还没有商品报表。请在 Seerfar「热销榜单 / 商品库」显示上架时间、销量、评论数、类目等指标后，用插件采集；这里会自动分析。'}</div>`:`<div class="source-tablewrap"><table class="source-table"><thead><tr><th>判断</th><th style="min-width:280px">商品 / SKU</th><th>类目</th><th>上架天数</th><th>销量</th><th>评论 / 评分</th><th>类目竞争密度</th><th>机会分</th><th>采集日期</th><th>依据</th></tr></thead><tbody>${s.items.map(x=>`<tr><td><span class="tag ${x.status==='recommended'?'ok':'warn'}">${opportunityLabels[x.status]}</span></td><td>${x.image_url&&sourceSafeUrl(x.image_url)?`<img src="${esc(sourceSafeUrl(x.image_url))}" alt="商品缩略图" loading="lazy" style="width:48px;height:48px;object-fit:cover;float:left;margin-right:8px">`:''}<b>${esc(x.title||'未提供商品名称')}</b><br><span class="muted">SKU ${esc(x.sku)}</span><br>${x.product_url?`<a href="${esc(x.product_url)}" target="_blank" rel="noopener noreferrer">打开 Ozon 商品卡 ↗</a>`:'<span class="muted">缺少可用商品卡链接</span>'}</td><td>${esc(x.category_key||'未提供')}</td><td>${n(x.age_days)}</td><td>${n(x.sales)}</td><td>${n(x.reviews)} / ${n(x.rating)}</td><td>${n(x.competition_density)}</td><td class="score">${n(x.score)}</td><td>${esc(x.captured_at.slice(0,10))}</td><td><button class="btn ghost small" data-op-action="detail" data-id="${x.id}">查看判断与原始数据</button></td></tr>`).join('')}</tbody></table></div>`}
    ${open?`<section class="source-row-detail"><div class="row between"><h2>SKU ${esc(open.sku)} · ${opportunityLabels[open.status]}</h2><button class="btn ghost small" data-op-action="close">收起</button></div><ul class="statuslist">${[...open.reasons,...open.warnings].map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p class="muted">上架依据：${esc(open.age_basis)} · 商品证据行 ${open.id} · 类目证据行 ${n(open.competition_evidence_id)} · ${esc(open.period_kind==='rolling_30d'?'最近 30 天快照':'自然月报表')} ${esc(open.period)}</p><dl class="source-detail-grid">${Object.entries(open.raw).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${sourceValue(v,k)}</dd></div>`).join('')}</dl></section>`:''}
    <div class="source-pager"><span class="muted">${s.total?n(s.offset+1):0}–${n(Math.min(s.offset+s.items.length,s.total))} / ${n(s.total)} 件 · 按判断与机会分排序</span><div class="row"><button class="btn ghost small" data-op-action="prev" ${s.offset===0||s.loading?'disabled':''}>上一页</button><button class="btn ghost small" data-op-action="next" ${s.offset+s.limit>=s.total||s.loading?'disabled':''}>下一页</button></div></div></div>`;
}
async function loadOpportunities(){const s=opportunityState,seq=loadOpportunities.seq=(loadOpportunities.seq||0)+1;s.loading=true;s.error='';if(state.view==='opportunities')render();try{const r=await api('/api/research/product-opportunities?'+new URLSearchParams({status:s.status,category_key:s.category,q:s.q,limit:s.limit,offset:s.offset}));if(seq!==loadOpportunities.seq)return;Object.assign(s,r,{open:null})}catch(e){if(seq!==loadOpportunities.seq)return;s.error=e.message;s.items=[]}finally{if(seq===loadOpportunities.seq){s.loading=false;if(state.view==='opportunities')render()}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-op-action]');if(!b)return;const s=opportunityState,a=b.dataset.opAction;if(a==='detail'){s.open=b.dataset.id;renderOpportunities();return}if(a==='close'){s.open=null;renderOpportunities();return}if(a==='filter'){s.status=$('#opStatus').value;s.category=$('#opCategory').value;s.q=$('#opQuery').value.trim();s.offset=0}if(a==='prev')s.offset=Math.max(0,s.offset-s.limit);if(a==='next')s.offset+=s.limit;await loadOpportunities()});
async function startWorkbench(){await load();const productId=new URLSearchParams(location.search).get('product_id');if(productId&&/^P\d{6}$/.test(productId)){try{await fetchProduct(productId)}catch(e){notice('采集商品读取失败：'+e.message,true)}}}
startWorkbench();
</script>
</body>
</html>
